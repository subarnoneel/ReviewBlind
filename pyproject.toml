[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reviewblind"
dynamic = ["version"]
description = "Deterministic, local-first preflight for accidental identity disclosure in research repositories before double-anonymous peer review."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "ReviewBlind contributors" }]
keywords = ["peer-review", "double-blind", "anonymization", "research", "static-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27",
    "rich>=15.0",
    "pymupdf>=1.28,<2",  # 2.x bundles onnxruntime and pymupdf4llm (docs/DECISIONS.md, D-37)
    "pillow>=13.0",
    "pyyaml>=6.0.3",
    "pathspec>=1.1",
]

[project.urls]
Repository = "https://github.com/subarnoneel/ReviewBlind"
Issues = "https://github.com/subarnoneel/ReviewBlind/issues"
Changelog = "https://github.com/subarnoneel/ReviewBlind/blob/main/CHANGELOG.md"

[project.scripts]
reviewblind = "reviewblind.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "mypy>=2.0",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.version]
path = "src/reviewblind/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewblind"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = [
    "error",
    # PyMuPDF's macOS wheels segfault on import if these become errors (docs/DECISIONS.md, D-39).
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["reviewblind"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Fixtures are deliberately malformed, or written to look like third-party research code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "S",            # bandit: this tool reads hostile input
    "PTH",          # pathlib
    "T20",          # no stray print
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # assert and subprocess are fine in tests

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
# PyMuPDF does not ship complete type information.
module = ["fitz", "pymupdf"]
ignore_missing_imports = true
