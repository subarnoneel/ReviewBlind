name: False positive or missed leak
description: ReviewBlind flagged something it should not have, or missed something it should have found
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public, and may be linked to you.** If your work is under anonymous review, do
        not paste the real leak. Describe its shape using the fictional persona: Alice Example, Example
        University, `alice@example.edu`, `aliceexample`.
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - False positive
        - Missed leak
        - Wrong severity or confidence
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID, if there is one
      placeholder: RB502
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - mirror
        - archive
        - repository
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Synthetic example
      description: A minimal example that reproduces the problem, and the file type
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened, and why?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed real names, emails, usernames, paths and URLs from this report
          required: true
