# The planted leaks: docs/TEST_PLAN.md in machine-readable form, one for each rule.
#
# Severities are written out by hand from docs/RULES.md rather than read from rules/catalog.py, so a
# mistake in the catalog fails here instead of being repeated. A leak counts as found only if `rule`
# fires on `path`, at this severity on each target, and its matched value contains `matched`.
#
# Why some are not simply the rule's base severity:
#   L07, L09, L21, L22 are indirect evidence, so a home path or service namespace is a WARNING.
#   L16 to L19 are BLOCKER on archive, since nothing excludes .git and it would be packaged.
#   L33 is BLOCKER everywhere, since the config is tracked by Git.

[[leak]]
id = "L01"
rule = "RB101"
path = "README.md"
matched = "Alice Example"
mirror = "BLOCKER"
archive = "BLOCKER"
repository = "BLOCKER"

[[leak]]
id = "L02"
rule = "RB102"
path = "README.md"
matched = "alice@example.edu"
mirror = "BLOCKER"
archive = "BLOCKER"
repository = "BLOCKER"

